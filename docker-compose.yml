name: solarbi

services:
  postgres:
    image: postgres:16.6
    container_name: solarbi-postgres
    environment:
      POSTGRES_USER: ${DB_USER:?falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  etl:
    build: .
    image: solarbi-etl:1.0
    profiles: ["etl"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?falta DB_NAME en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - ./data/bronze:/app/data/bronze:ro

volumes:
  pgdata: