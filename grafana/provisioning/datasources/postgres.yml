apiVersion: 1
datasources:
  - name: SolarBI Postgres
    uid: solarbi-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${DB_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${DB_NAME}
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
    secureJsonData:
      password: ${DB_PASSWORD}
