apiVersion: 1
groups:
- orgId: 1
  name: solarbi-red
  folder: SolarBI
  interval: 10s
  rules:
  - uid: solarbi-red-caida
    title: Red caída (voltaje de línea < 100 V)
    condition: C
    for: 20s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Voltaje de línea bajo el umbral en el inversor {{ $labels.metric }}
      description: 'Umbral de 100 V: el mismo que usa el dataset para marcar grid_unavailable_or_islanded (nominal ~235 V).'
    labels:
      severidad: critica
      linea: '4'
    data:
    - refId: A
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, inverter::text AS metric, avg(voltaje_v) AS value FROM silver.lectura_vivo WHERE ts > now() - interval '30 seconds' GROUP BY inverter
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 100
  - uid: solarbi-telemetria-silencio
    title: Telemetría en silencio (> 60 s sin datos)
    condition: C
    for: 10s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: El inversor {{ $labels.metric }} no reporta hace más de 60 s
      description: Con muestreo simulado de 5 s, 60 s equivalen a ~12 lecturas perdidas. En la fuente real el intervalo típico es 11-60 s.
    labels:
      severidad: advertencia
      linea: '4'
    data:
    - refId: A
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, inverter::text AS metric, extract(epoch FROM now() - max(ts)) AS value FROM silver.lectura_vivo GROUP BY inverter
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 60
