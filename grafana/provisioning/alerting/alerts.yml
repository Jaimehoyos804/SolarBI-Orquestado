      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, extract(epoch FROM now() - max(ts)) AS value FROM silver.lectura_vivo WHERE inverter = 2
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
