apiVersion: 1
deleteRules:
- orgId: 1
  uid: solarbi-red-caida
- orgId: 1
  uid: solarbi-telemetria-silencio
groups:
- orgId: 1
  name: solarbi-red
  folder: SolarBI
  interval: 10s
  rules:
  - uid: solarbi-red-caida-inv1
    title: Red caída · Inversor 1 (voltaje < 100 V)
    condition: C
    for: 20s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Voltaje de línea bajo el umbral en el inversor 1
      description: 'Umbral de 100 V: el mismo que usa el dataset para marcar grid_unavailable_or_islanded (nominal ~235 V).'
    labels:
      severidad: critica
      linea: '4'
    data:
    - refId: A
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, avg(voltaje_v) AS value FROM silver.lectura_vivo WHERE inverter = 1 AND ts > now() - interval '30 seconds'
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 100
  - uid: solarbi-red-caida-inv2
    title: Red caída · Inversor 2 (voltaje < 100 V)
    condition: C
    for: 20s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Voltaje de línea bajo el umbral en el inversor 2
      description: 'Umbral de 100 V: el mismo que usa el dataset para marcar grid_unavailable_or_islanded (nominal ~235 V).'
    labels:
      severidad: critica
      linea: '4'
    data:
    - refId: A
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, avg(voltaje_v) AS value FROM silver.lectura_vivo WHERE inverter = 2 AND ts > now() - interval '30 seconds'
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 100
  - uid: solarbi-silencio-inv1
    title: Telemetría en silencio · Inversor 1 (> 60 s)
    condition: C
    for: 10s
    noDataState: OK
    execErrState: Error
    annotations:
      summary: El inversor 1 no reporta hace más de 60 s
      description: Con muestreo simulado de 5 s, 60 s equivalen a ~12 lecturas perdidas. En la fuente real el intervalo típico es 11-60 s.
    labels:
      severidad: advertencia
      linea: '4'
    data:
    - refId: A
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: solarbi-pg
      model:
        refId: A
        datasource:
          type: grafana-postgresql-datasource
          uid: solarbi-pg
        editorMode: code
        format: time_series
        rawQuery: true
        rawSql: SELECT now() AS time, extract(epoch FROM now() - max(ts)) AS value FROM silver.lectura_vivo WHERE inverter = 1
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
        datasource:
          type: __expr__
          uid: __expr__
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 60
        to: 0
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: gt
            params:
            - 60
  - uid: solarbi-silencio-inv2
    title: Telemetría en silencio · Inversor 2 (> 60 s)
    condition: C
