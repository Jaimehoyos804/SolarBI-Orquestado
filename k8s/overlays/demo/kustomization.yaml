apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: solarbi-demo

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      ambiente: demo
      app.kubernetes.io/part-of: solarbi
    includeSelectors: false

configMapGenerator:
  - name: solarbi-config
    behavior: merge
    literals:
      - SIM_INTERVALO_S=5
