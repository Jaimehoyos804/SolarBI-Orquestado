# Grafana: Deployment (sin estado propio: todo se carga por provisioning)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0   # versión fija, nada de latest
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: solarbi-secrets, key: GRAFANA_ADMIN_PASSWORD}}
            # Variables que usa postgres.yml (${DB_USER}, ${DB_NAME}, ${DB_PASSWORD})
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: solarbi-secrets, key: DB_USER}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: solarbi-secrets, key: DB_NAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: solarbi-secrets, key: DB_PASSWORD}}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: ds, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dash, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            - {name: storage, mountPath: /var/lib/grafana}
      volumes:
        - name: ds
          configMap: {name: grafana-datasources}
        - name: dash
          configMap: {name: grafana-dashboards}
        - name: alerting
          configMap: {name: grafana-alerting}
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http, nodePort: 30300}
